<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS Defects List</title>
    <style>
        :root { --primary: #4b0082; --bg: #2e003e; --card: #ffffff; --text: #1c1c1e; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; padding: 16px; margin: 0; }
        .sticky-header { position: sticky; top: 0; background: var(--bg); padding: 10px; z-index: 999; display: flex; justify-content: center; }
        .copy-btn { background: #00c853; color: white; border: none; padding: 20px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; font-size: 18px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .category-block { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .defect-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        h3 { margin-top: 0; color: var(--primary); font-size: 16px; text-transform: uppercase; }
        h1 { color: white; text-align: center; font-size: 20px; }
    </style>
</head>
<body>
    <h1>NCS Defects List</h1>
    <div class="sticky-header"><button class="copy-btn" onclick="copyNCS()">📋 COPY SELECTED</button></div>
    
    <div class="category-block">
        <h3>🔧 Add Custom NCS</h3>
        <input type="text" id="new_shorthand" placeholder="e.g. Defect description,ncs."><br><br>
        <button onclick="addNewDefect()" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:5px; cursor:pointer;">Add to Top of List</button>
    </div>

    <div id="custom_list"></div>

    <div id="list_container">
        <div class="category-block">
            <h3>Installation Pipework</h3>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Gas pipe sleeved/sealed incorrectly through wall,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Gas pipe too close to electrics,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Cooker point incorrectly sited,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Anaconda ribs touching/stretched,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Exposed stainless steel pipe incorrectly taped,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Inadequately supported gas pipework,ncs."></div>
        </div>
        <div class="category-block">
            <h3>Gas Meter Setup</h3>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Meter enclosure door damaged/missing,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Gas meter box latch missing,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Gas meter box outlet adaptor/union missing,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Meter bank ventilation below highest joint,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Meter bracket securing clips missing,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Meter regulator missing security seal,ncs."></div>
        </div>
        <div class="category-block">
            <h3>Valves & Appliances</h3>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Equipotential earth bonding missing/inadequate,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Filling link left connected contrary to water regulations,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Cooker stability chain/bracket missing,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Condensate not to MI's,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Fire stop plate missing through ceiling,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Boiler flue not sealed to fabric of building,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Flue terminal within min distance to opening,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="No Reg 15 emergency notice fitted at meter,ncs."></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            let saved = JSON.parse(localStorage.getItem('ncs_custom') || '[]');
            saved.forEach(text => renderItem(text, false));
        };
        function addNewDefect() {
            let input = document.getElementById('new_shorthand');
            if(!input.value) return;
            let saved = JSON.parse(localStorage.getItem('ncs_custom') || '[]');
            saved.unshift(input.value);
            localStorage.setItem('ncs_custom', JSON.stringify(saved));
            renderItem(input.value, true);
            input.value = '';
        }
        function renderItem(text, isNew) {
            let div = document.createElement('div');
            div.className = 'defect-row';
            div.innerHTML = `<input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="${text}">`;
            let container = document.getElementById('custom_list');
            if(isNew) container.prepend(div); else container.appendChild(div);
        }
        function copyNCS() {
            let selected = [];
            document.querySelectorAll('.fault-check').forEach(check => { 
                if(check.checked) selected.push(check.nextElementSibling.value);
            });
            if(selected.length === 0) return alert("Select at least one item.");
            let output = selected.join('\n');
            navigator.clipboard.writeText(output).then(() => alert("Copied to clipboard!")).catch(() => {
                let textArea = document.createElement("textarea");
                textArea.value = output;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
                alert("Copied!");
            });
        }
    </script>
</body>
</html>
