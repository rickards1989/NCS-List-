<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS Defects List</title>
    <style>
        :root { --primary: #4b0082; --bg: #2e003e; --card: #ffffff; --text: #1c1c1e; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; padding: 16px; margin: 0; }
        .sticky-header { position: sticky; top: 0; background: var(--bg); padding: 10px; z-index: 999; display: flex; justify-content: center; }
        .copy-btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
        .category-block { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .defect-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
        input[type="text"] { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        h3 { margin-top: 0; color: var(--primary); font-size: 16px; text-transform: uppercase; }
        h1 { color: white; text-align: center; font-size: 20px; }
    </style>
</head>
<body>
    <h1>NCS Defects List</h1>
    <div class="sticky-header"><button class="copy-btn" onclick="copyNCS()">Copy Selected Faults</button></div>
    
    <div class="category-block">
        <h3>🔧 Add Custom NCS</h3>
        <input type="text" id="new_shorthand" placeholder="Shorthand,ncs."><br><br>
        <button onclick="addNewDefect()" style="width:100%; padding:10px; background:var(--primary); color:white; border:none; border-radius:5px; cursor:pointer;">Add Item</button>
    </div>

    <div id="custom_list"></div>
    <div id="list_container">
        <div class="category-block">
            <h3>Installation Pipework</h3>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Gas pipe sleeved/sealed incorrectly through wall,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="Gas pipe too close to electrics,ncs."></div>
            <div class="defect-row"><input type="checkbox" class="fault-check"><input type="text" value="Cooker point incorrectly sited,ncs."></div>
        </div>
        </div>

    <script>
        // Load custom items on startup
        window.onload = function() {
            let saved = JSON.parse(localStorage.getItem('custom_ncs') || '[]');
            saved.forEach(text => renderItem(text));
        };

        function addNewDefect() {
            let short = document.getElementById('new_shorthand').value;
            if(!short) return;
            
            // Save to memory
            let saved = JSON.parse(localStorage.getItem('custom_ncs') || '[]');
            saved.unshift(short);
            localStorage.setItem('custom_ncs', JSON.stringify(saved));
            
            renderItem(short);
            document.getElementById('new_shorthand').value = '';
        }

        function renderItem(text) {
            let div = document.createElement('div');
            div.className = 'defect-row';
            div.innerHTML = `<input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="${text}">`;
            document.getElementById('custom_list').prepend(div);
        }

        function copyNCS() {
            let selected = [];
            document.querySelectorAll('.defect-row').forEach(row => { 
                if(row.querySelector('.fault-check').checked) {
                    selected.push(row.querySelector('.fault-text').value);
                }
            });
            if(selected.length === 0) return alert("No items selected");
            
            // This forces the text to be copied
            let textToCopy = selected.join('\n');
            let dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = textToCopy;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);
            alert("Copied to clipboard!");
        }
    </script>
</body>
</html>
