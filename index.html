<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas Defect Reporting Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #2e003e; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { padding: 12px; background: #1a0022; color: white; display: flex; justify-content: space-between; align-items: center; }
        .controls { padding: 10px; background: #2e003e; flex-shrink: 0; }
        .action-bar { display: flex; gap: 8px; margin-bottom: 10px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; color: white; font-weight: bold; }
        #searchBar { width: 100%; padding: 12px; border: none; border-radius: 6px; box-sizing: border-box; font-size: 16px; margin-bottom: 5px; }
        
        #list_container { flex-grow: 1; overflow-y: auto; padding: 10px 10px 40px 10px; }
        
        .defect-row { background: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; align-items: center; gap: 12px; border: 3px solid transparent; transition: 0.2s; }
        .defect-row.selected { background: #b9f6ca; border-color: #00c853; }
        .delete-mode-active { border-color: #d32f2f !important; background: #ffccbc !important; }
        
        /* The Wobble/Lift effect */
        .sortable-ghost { opacity: 0.4; background: #f0f0f0; }
        .sortable-chosen { transform: rotate(2deg) scale(1.02); box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 100; }
        
        .drag-handle { cursor: grab; font-size: 22px; color: #aaa; padding-right: 5px; }
        .row-text { flex-grow: 1; padding: 5px; cursor: pointer; font-size: 16px; font-weight: 500; }
    </style>
</head>
<body>

    <div id="header">
        <span style="font-weight: bold;">Gas Defect Reporting Tool</span>
        <button onclick="resetList()" style="color:#aaa; background:transparent; border:1px solid #555; padding: 5px; cursor: pointer; border-radius: 4px;">RESET</button>
    </div>

    <div class="controls">
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
            <button style="background:#00c853; color:white; border:none; flex: 2; padding:16px; font-weight:bold; font-size:16px; border-radius:8px;" onclick="copyNCS()">📋 COPY</button>
            <button style="background:#ff9800; color:white; border:none; flex: 1; padding:16px; font-weight:bold; font-size:16px; border-radius:8px;" onclick="clearSelection()">✖ CLEAR</button>
        </div>
        <div class="action-bar">
            <button class="action-btn" style="background:#444;" onclick="addNewDefect()">+ ADD CUSTOM</button>
            <button class="action-btn" id="delBtn" style="background:#d32f2f;" onclick="toggleDeleteMode()">🗑 DELETE MODE: OFF</button>
        </div>
        <input type="text" id="searchBar" placeholder="🔍 Search..." onkeyup="filterList()">
    </div>

    <div id="list_container"></div>

    <script>
        const defaultList = ["Filling loop connected,ncs.", "Condensate not to MI's,ncs.", "Gas pipe too close to electric cable/apparatus,ncs.", "Anaconda ribs touching/stretched,ncs.", "Gas pipe sleeved/sealed incorrectly,ncs.", "Inadequately supported gas pipework,ncs.", "Gas meter box door/enclosure damaged or missing,ncs.", "Gas meter box latch missing,ncs.", "Gas meter box outlet adaptor/union missing,ncs.", "Meter bank ventilation below highest joint,ncs.", "Meter bracket securing clips missing,ncs.", "Meter regulator missing security seal,ncs.", "Flue terminal clearances incorrect,ncs.", "Equipotential earth bonding missing/inadequate,ncs.", "Boiler flue not sealed to fabric of building,ncs.", "Cooker point incorrectly sited,ncs.", "Cooker stability chain/bracket missing,ncs.", "Fire stop plate missing through ceiling,ncs.", "TracPipe (CSST) not correctly taped/protected,ncs.", "No Reg 15 emergency notice fitted at meter,ncs."];
        
        let isDeleteMode = false;
        let selectedItems = new Set(); 

        window.onload = () => { 
            loadList(); 
            // Added class names for the wobble/lift effect
            new Sortable(document.getElementById('list_container'), { 
                handle: '.drag-handle', 
                animation: 200, 
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                onEnd: saveOrder 
            }); 
        };

        function loadList() {
            let saved = JSON.parse(localStorage.getItem('ncs_list') || JSON.stringify(defaultList));
            render(saved);
        }

        function render(list) {
            let container = document.getElementById('list_container');
            container.innerHTML = '';
            let sorted = [...list].sort((a, b) => selectedItems.has(b) - selectedItems.has(a));
            
            sorted.forEach((text) => {
                let div = document.createElement('div');
                div.className = 'defect-row' + (selectedItems.has(text) ? ' selected' : '') + (isDeleteMode ? ' delete-mode-active' : '');
                div.innerHTML = `<div class="drag-handle">☰</div><div class="row-text" onclick="handleRowClick(this.parentElement, '${text.replace(/'/g, "\\'")}')">${text}</div>`;
                container.appendChild(div);
            });
        }

        function handleRowClick(row, text) {
            if (isDeleteMode) {
                if(!confirm("Delete this defect?")) return;
                let list = JSON.parse(localStorage.getItem('ncs_list') || JSON.stringify(defaultList));
                list = list.filter(item => item !== text);
                selectedItems.delete(text);
                localStorage.setItem('ncs_list', JSON.stringify(list));
                loadList();
            } else {
                if (selectedItems.has(text)) selectedItems.delete(text);
                else selectedItems.add(text);
                document.getElementById('searchBar').value = '';
                filterList(); 
                loadList(); 
            }
        }

        function clearSelection() {
            selectedItems.clear();
            loadList();
        }

        function toggleDeleteMode() {
            isDeleteMode = !isDeleteMode;
            document.getElementById('delBtn').innerText = isDeleteMode ? "🗑 DELETE MODE: ON" : "🗑 DELETE MODE: OFF";
            render(JSON.parse(localStorage.getItem('ncs_list') || JSON.stringify(defaultList)));
        }

        function copyNCS() {
            if (selectedItems.size === 0) return alert("Select at least one.");
            
            // Grabs only the text from rows that are currently highlighted green (.selected)
            // It naturally reads top-to-bottom on the screen.
            let selectedNodes = document.querySelectorAll('.defect-row.selected .row-text');
            
            // Extracts the text and joins them with a comma and a space
            let textToCopy = Array.from(selectedNodes).map(el => el.innerText).join(', ');
            
            navigator.clipboard.writeText(textToCopy).then(() => alert("Copied!"));
        }

        function addNewDefect() {
            let text = prompt("Enter note:");
            if(!text) return;
            let list = JSON.parse(localStorage.getItem('ncs_list') || JSON.stringify(defaultList));
            list.unshift(text);
            localStorage.setItem('ncs_list', JSON.stringify(list));
            loadList();
        }

        function saveOrder() {
            let list = Array.from(document.querySelectorAll('.row-text')).map(el => el.innerText);
            localStorage.setItem('ncs_list', JSON.stringify(list));
        }

        function filterList() {
            let query = document.getElementById('searchBar').value.toLowerCase();
            document.querySelectorAll('.defect-row').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        }

        function resetList() { if(confirm("Factory reset?")) { localStorage.removeItem('ncs_list'); location.reload(); } }
    </script>
</body>
</html>
