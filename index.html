<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS Defects List</title>
    <style>
        :root { --primary: #4b0082; --bg: #2e003e; --card: #ffffff; --text: #1c1c1e; --danger: #ff4d4d; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; padding: 16px; margin: 0; }
        .sticky-header { position: sticky; top: 0; background: var(--bg); padding: 10px; z-index: 999; display: flex; justify-content: center; gap: 5px; }
        .action-btn { background: #555; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; font-size: 14px; }
        .copy-btn { background: #00c853; color: white; flex: 2; }
        .defect-row { display: flex; align-items: center; gap: 8px; padding: 12px; margin-bottom: 6px; background: var(--card); border-radius: 6px; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .delete-btn { background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        h1 { color: white; text-align: center; font-size: 18px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>NCS Defects List</h1>
    <div class="sticky-header">
        <button class="action-btn copy-btn" onclick="copyNCS()">📋 COPY</button>
        <button class="action-btn" onclick="undo()">↩️ UNDO</button>
        <button class="action-btn" onclick="resetList()">🔄 RESET</button>
    </div>
    
    <div style="background: white; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
        <input type="text" id="new_shorthand" placeholder="Add custom,ncs."><br>
        <button onclick="addNewDefect()" style="width:100%; padding:10px; margin-top:8px; background:var(--primary); color:white; border:none; border-radius:4px;">Add to Top</button>
    </div>

    <div id="list_container"></div>

    <script>
        const initialList = [
            "Gas pipe sleeved/sealed incorrectly through wall,ncs.", "Gas pipe too close to electrics,ncs.", "Cooker point incorrectly sited,ncs.", "Anaconda ribs touching/stretched,ncs.", "Exposed stainless steel pipe incorrectly taped,ncs.", "Inadequately supported gas pipework,ncs.",
            "Meter enclosure door damaged/missing,ncs.", "Gas meter box latch missing,ncs.", "Gas meter box outlet adaptor/union missing,ncs.", "Meter bank ventilation below highest joint,ncs.", "Meter bracket securing clips missing,ncs.", "Meter regulator missing security seal,ncs.",
            "Equipotential earth bonding missing/inadequate,ncs.", "Filling link left connected contrary to water regulations,ncs.", "Cooker stability chain/bracket missing,ncs.", "Condensate not to MI's,ncs.", "Fire stop plate missing through ceiling,ncs.", "Boiler flue not sealed to fabric of building,ncs.", "Flue terminal within min distance to opening,ncs.", "No Reg 15 emergency notice fitted at meter,ncs."
        ];

        window.onload = () => { loadList(); };

        function loadList() {
            let list = JSON.parse(localStorage.getItem('ncs_flat_list') || JSON.stringify(initialList));
            render(list);
        }

        function render(list) {
            document.getElementById('list_container').innerHTML = '';
            list.forEach(text => {
                let div = document.createElement('div');
                div.className = 'defect-row';
                div.innerHTML = `<input type="checkbox" class="fault-check"><input type="text" class="fault-text" value="${text}" onchange="saveChanges()"><button class="delete-btn" onclick="deleteItem(this)">✕</button>`;
                document.getElementById('list_container').appendChild(div);
            });
        }

        function saveChanges() {
            let list = [];
            document.querySelectorAll('.fault-text').forEach(input => list.push(input.value));
            localStorage.setItem('history_prev', localStorage.getItem('ncs_flat_list'));
            localStorage.setItem('ncs_flat_list', JSON.stringify(list));
        }

        function deleteItem(btn) {
            saveChanges();
            btn.parentElement.remove();
        }

        function undo() {
            let prev = localStorage.getItem('history_prev');
            if (prev && prev !== 'null') {
                localStorage.setItem('ncs_flat_list', prev);
                localStorage.setItem('history_prev', 'null');
                loadList();
            } else {
                alert("Nothing to undo!");
            }
        }

        function addNewDefect() {
            let input = document.getElementById('new_shorthand');
            if(!input.value) return;
            saveChanges();
            let current = JSON.parse(localStorage.getItem('ncs_flat_list'));
            current.unshift(input.value);
            localStorage.setItem('ncs_flat_list', JSON.stringify(current));
            loadList();
            input.value = '';
        }

        function resetList() {
            if(confirm("Restore original list?")) {
                localStorage.removeItem('ncs_flat_list');
                localStorage.removeItem('history_prev');
                loadList();
            }
        }

        function copyNCS() {
            let selected = [];
            document.querySelectorAll('.fault-check:checked').forEach(c => selected.push(c.nextElementSibling.value));
            if(selected.length === 0) return alert("Select items first.");
            let output = selected.join('\n');
            navigator.clipboard.writeText(output).then(() => alert("Copied!")).catch(() => {
                let t = document.createElement("textarea"); t.value = output; document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t); alert("Copied!");
            });
        }
    </script>
</body>
</html>
