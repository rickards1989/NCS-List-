<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas Defect Reporting Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #2e003e; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { padding: 10px; background: #1a0022; color: white; display: flex; justify-content: space-between; align-items: center; }
        .copy-btn { background: #00c853; color: white; border: none; padding: 16px; font-weight: bold; font-size: 18px; border-radius: 6px; width: 100%; margin-bottom: 10px; cursor: pointer; }
        .action-bar { display: flex; gap: 5px; margin-bottom: 10px; padding: 0 10px; }
        .action-btn { flex: 1; padding: 12px; background: #444; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
        #searchBar { width: calc(100% - 20px); margin: 0 10px 10px 10px; padding: 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; }
        #list_container { flex-grow: 1; overflow-y: auto; padding: 0 10px 20px 10px; }
        
        .defect-row { background: white; padding: 10px; margin-bottom: 8px; border-radius: 6px; display: flex; align-items: center; gap: 10px; border: 2px solid transparent; }
        .defect-row.selected { background: #e8f5e9; border: 2px solid #00c853; }
        
        .drag-handle { cursor: grab; font-size: 24px; color: #888; padding: 5px; }
        .row-text { flex-grow: 1; padding: 5px; cursor: pointer; }
        .fault-text { border: none; width: 100%; font-size: 16px; background: transparent; pointer-events: none; }
        .delete-btn { background: #ff5252; color: white; border: none; border-radius: 4px; padding: 6px 10px; cursor: pointer; font-size: 14px; }
        .check-icon { display: none; font-size: 18px; }
        .selected .check-icon { display: block; }
    </style>
</head>
<body>

    <div id="header">
        <span style="font-weight: bold;">Gas Defect Reporting Tool</span>
        <button onclick="resetList()" style="color:white; background:transparent; border:1px solid #555; padding: 5px; cursor: pointer;">RESET</button>
    </div>

    <button class="copy-btn" onclick="copyNCS()">📋 COPY SELECTED</button>

    <div class="action-bar">
        <button class="action-btn" onclick="addNewDefect()">+ ADD CUSTOM</button>
        <button class="action-btn" id="undoBtn" onclick="undoDelete()" style="background:#00bcd4; display:none;">↩️ UNDO DELETE</button>
    </div>

    <input type="text" id="searchBar" placeholder="🔍 Search..." onkeyup="filterList()">

    <div id="list_container"></div>

    <script>
        const defaultList = ["Filling loop connected,ncs.", "Condensate not to MI's,ncs.", "Gas pipe too close to electric cable/apparatus,ncs.", "Anaconda ribs touching/stretched,ncs.", "Gas pipe sleeved/sealed incorrectly,ncs.", "Inadequately supported gas pipework,ncs.", "Gas meter box door/enclosure damaged or missing,ncs.", "Gas meter box latch missing,ncs.", "Gas meter box outlet adaptor/union missing,ncs.", "Meter bank ventilation below highest joint,ncs.", "Meter bracket securing clips missing,ncs.", "Meter regulator missing security seal,ncs.", "Flue terminal clearances incorrect,ncs.", "Equipotential earth bonding missing/inadequate,ncs.", "Boiler flue not sealed to fabric of building,ncs.", "Cooker point incorrectly sited,ncs.", "Cooker stability chain/bracket missing,ncs.", "Fire stop plate missing through ceiling,ncs.", "TracPipe (CSST) not correctly taped/protected,ncs.", "No Reg 15 emergency notice fitted at meter,ncs."];

        let deletedItem = null, deletedIndex = null;
        window.onload = () => {
            loadList();
            new Sortable(document.getElementById('list_container'), { 
                handle: '.drag-handle',
                animation: 150, 
                onEnd: saveChanges 
            });
        };

        function loadList() {
            let saved = localStorage.getItem('ncs_flat_list');
            render(saved ? JSON.parse(saved) : defaultList);
        }

        function render(list) {
            let container = document.getElementById('list_container');
            container.innerHTML = '';
            list.forEach((text, index) => {
                let div = document.createElement('div');
                div.className = 'defect-row';
                div.innerHTML = `
                    <div class="drag-handle">☰</div>
                    <div class="row-text" onclick="toggleRow(this.parentElement)">
                        <span class="check-icon">✅</span>
                        <input type="text" class="fault-text" value="${text}" onchange="saveChanges()">
                    </div>
                    <button class="delete-btn" onclick="deleteItem(event, ${index})">🗑</button>
                `;
                container.appendChild(div);
            });
        }

        function toggleRow(row) {
            row.classList.toggle('selected');
            if (row.classList.contains('selected')) {
                document.getElementById('list_container').prepend(row);
            }
            saveChanges();
        }

        function deleteItem(e, index) {
            e.stopPropagation();
            let list = JSON.parse(localStorage.getItem('ncs_flat_list') || JSON.stringify(defaultList));
            deletedItem = list[index]; deletedIndex = index;
            list.splice(index, 1);
            localStorage.setItem('ncs_flat_list', JSON.stringify(list));
            document.getElementById('undoBtn').style.display = 'block';
            loadList();
        }

        function undoDelete() {
            let list = JSON.parse(localStorage.getItem('ncs_flat_list') || JSON.stringify(defaultList));
            list.splice(deletedIndex, 0, deletedItem);
            localStorage.setItem('ncs_flat_list', JSON.stringify(list));
            document.getElementById('undoBtn').style.display = 'none';
            loadList();
        }

        function addNewDefect() {
            let text = prompt("Enter note:");
            if(!text) return;
            let list = JSON.parse(localStorage.getItem('ncs_flat_list') || JSON.stringify(defaultList));
            list.unshift(text);
            localStorage.setItem('ncs_flat_list', JSON.stringify(list));
            loadList();
        }

        function saveChanges() {
            let list = [];
            document.querySelectorAll('.fault-text').forEach(input => list.push(input.value));
            localStorage.setItem('ncs_flat_list', JSON.stringify(list));
        }

        function copyNCS() {
            let selected = [];
            document.querySelectorAll('.defect-row.selected').forEach(row => {
                selected.push(row.querySelector('.fault-text').value);
            });
            if(selected.length === 0) return alert("Select at least one.");
            navigator.clipboard.writeText(selected.join('\n')).then(() => alert("Copied in order!"));
        }

        function filterList() {
            let filter = document.getElementById('searchBar').value.toLowerCase();
            document.querySelectorAll('.defect-row').forEach(row => {
                row.style.display = row.querySelector('.fault-text').value.toLowerCase().includes(filter) ? "flex" : "none";
            });
        }
    </script>
</body>
</html>
