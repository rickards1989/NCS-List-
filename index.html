<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS App</title>
    <style>
        body { margin: 0; font-family: sans-serif; transition: all 0.3s; }
        /* Floating State */
        #app-container {
            position: fixed; top: 20px; left: 20px; width: 320px; height: 80vh;
            background: rgba(46, 0, 62, 0.98); border-radius: 12px;
            padding: 10px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }
        /* Full Screen State */
        .full-screen { top: 0 !important; left: 0 !important; width: 100% !important; height: 100vh !important; border-radius: 0 !important; }
        
        #header { display: flex; align-items: center; justify-content: space-between; color: white; padding: 5px; cursor: move; }
        .copy-btn { background: #00c853; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 6px; width: 100%; margin-bottom: 10px; }
        #searchBar { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border-radius: 4px; }
        #list_container { overflow-y: auto; flex-grow: 1; }
        .defect-row { background: white; padding: 8px; margin-bottom: 6px; border-radius: 4px; display: flex; align-items: center; gap: 8px; }
        .fault-text { border: none; width: 100%; font-size: 14px; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="header">
            <span id="drag-handle">☰ MOVE</span>
            <button onclick="toggleSize()" style="background:none; border:none; color:white; font-size:20px;">⛶</button>
        </div>
        <button class="copy-btn" onclick="copyNCS()">📋 COPY SELECTED</button>
        <input type="text" id="searchBar" placeholder="Search..." onkeyup="filterList()">
        <div id="list_container"></div>
    </div>

    <script>
        const initialList = [
            "Filling loop connected,ncs.", "Condensate not to MI's,ncs.", "Gas pipe too close to electric cable/apparatus,ncs.", 
            "Anaconda ribs touching/stretched,ncs.", "Gas pipe sleeved/sealed incorrectly,ncs.", "Inadequately supported gas pipework,ncs.", 
            "Gas meter box door/enclosure damaged or missing,ncs.", "Gas meter box latch missing,ncs.", 
            "Gas meter box outlet adaptor/union missing,ncs.", "Meter bank ventilation below highest joint,ncs.", 
            "Meter bracket securing clips missing,ncs.", "Meter regulator missing security seal,ncs.", "Flue terminal clearances incorrect,ncs.", 
            "Equipotential earth bonding missing/inadequate,ncs.", "Boiler flue not sealed to fabric of building,ncs.", 
            "Cooker point incorrectly sited,ncs.", "Cooker stability chain/bracket missing,ncs.", 
            "Fire stop plate missing through ceiling,ncs.", "TracPipe (CSST) not correctly taped/protected,ncs.", 
            "No Reg 15 emergency notice fitted at meter,ncs."
        ];

        function toggleSize() {
            const container = document.getElementById('app-container');
            container.classList.toggle('full-screen');
        }

        // Keep your existing Drag, Load, and Render logic here...
        // Drag Functionality
        const container = document.getElementById('app-container');
        let isDragging = false;
        document.getElementById('drag-handle').addEventListener('touchstart', (e) => isDragging = true);
        document.addEventListener('touchmove', (e) => {
            if(isDragging && !container.classList.contains('full-screen')) {
                container.style.left = (e.touches[0].clientX - 100) + 'px';
                container.style.top = (e.touches[0].clientY - 20) + 'px';
            }
        });
        document.addEventListener('touchend', () => isDragging = false);

        // ... Add your render/copyNCS functions from before ...
        window.onload = () => { /* render your list */ };
    </script>
</body>
</html>
