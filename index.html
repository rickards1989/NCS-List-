<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS Tool</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #2e003e; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #header { padding: 10px; background: #1a0022; color: white; display: flex; justify-content: space-between; align-items: center; }
        .copy-btn { background: #00c853; color: white; border: none; padding: 12px; font-weight: bold; font-size: 16px; border-radius: 6px; width: 100%; margin-bottom: 10px; cursor: pointer; }
        
        .action-bar { display: flex; gap: 5px; margin-bottom: 10px; padding: 0 10px; }
        .action-btn { flex: 1; padding: 8px; background: #444; color: white; border: none; border-radius: 4px; cursor: pointer; }
        
        #searchBar { width: calc(100% - 20px); margin: 0 10px 10px 10px; padding: 12px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; }
        
        #list_container { flex-grow: 1; overflow-y: auto; padding: 0 10px 20px 10px; }
        .defect-row { background: white; padding: 10px; margin-bottom: 8px; border-radius: 6px; display: flex; align-items: center; gap: 10px; }
        .fault-text { border: none; width: 100%; font-size: 16px; }
        .delete-btn { background: none; border: none; cursor: pointer; font-size: 20px; padding: 5px; }
    </style>
</head>
<body>

    <div id="header">
        <span style="font-weight: bold;">NCS Defects</span>
        <button onclick="resetList()" style="background:none; border:none; color:#ff5252; font-size:14px; cursor:pointer;">RESET</button>
    </div>

    <button class="copy-btn" onclick="copyNCS()">📋 COPY SELECTED</button>

    <div class="action-bar">
        <button class="action-btn" onclick="undo()">UNDO</button>
        <button class="action-btn" onclick="addNewDefect()">+ ADD CUSTOM</button>
    </div>

    <input type="text" id="searchBar" placeholder="🔍 Search..." onkeyup="filterList()">

    <div id="list_container"></div>

    <script>
        const initialList = [
            "Filling loop connected,ncs.", "Condensate not to MI's,ncs.", "Gas pipe too close to electric cable/apparatus,ncs.", 
            "Anaconda ribs touching/stretched,ncs.", "Gas pipe sleeved/sealed incorrectly,ncs.", "Inadequately supported gas pipework,ncs.", 
            "Gas meter box door/enclosure damaged or missing,ncs.", "Gas meter box latch missing,ncs.", 
            "Gas meter box outlet adaptor/union missing,ncs.", "Meter bank ventilation below highest joint,ncs.", 
            "Meter bracket securing clips missing,ncs.", "Meter regulator missing security seal,ncs.", "Flue terminal clearances incorrect,ncs.", 
            "Equipotential earth bonding missing/inadequate,ncs.", "Boiler flue not sealed to fabric of building,ncs.", 
            "Cooker point incorrectly sited,ncs.", "Cooker stability chain/bracket missing,ncs.", 
            "Fire stop plate missing through ceiling,ncs.", "TracPipe (CSST) not correctly taped/protected,ncs.", 
            "No Reg 15 emergency notice fitted at meter,ncs."
        ];

        window.onload = () => { loadList(); };
        
        function loadList() {
            let saved = localStorage.getItem('ncs_flat_list');
            render(saved ? JSON.parse(saved) : initialList);
        }

        function render(list) {
            document.getElementById('list_container').innerHTML = '';
            list.forEach(text => {
                let div = document.createElement('div');
                div.className = 'defect-row';
                div.innerHTML = `<input type="checkbox" class="fault-check" style="transform: scale(1.5);"><input type="text" class="fault-text" value="${text}" onchange="saveChanges()"><button class="delete-btn" onclick="deleteItem(this)">🗑️</button>`;
                document.getElementById('list_container').appendChild(div);
            });
        }

        function saveChanges() {
            let list = [];
            document.querySelectorAll('.fault-text').forEach(input => list.push(input.value));
            localStorage.setItem('history_prev', localStorage.getItem('ncs_flat_list'));
            localStorage.setItem('ncs_flat_list', JSON.stringify(list));
        }

        function deleteItem(btn) {
            saveChanges();
            btn.parentElement.remove();
        }

        function undo() {
            let prev = localStorage.getItem('history_prev');
            if (prev) {
                localStorage.setItem('ncs_flat_list', prev);
                localStorage.removeItem('history_prev');
                loadList();
            }
        }

        function addNewDefect() {
            let text = prompt("Enter new defect:");
            if(!text) return;
            saveChanges();
            let current = JSON.parse(localStorage.getItem('ncs_flat_list') || JSON.stringify(initialList));
            current.unshift(text + ",ncs.");
            localStorage.setItem('ncs_flat_list', JSON.stringify(current));
            loadList();
        }

        function resetList() {
            if(confirm("Reset to original list?")) {
                localStorage.removeItem('ncs_flat_list');
                loadList();
            }
        }

        function copyNCS() {
            let selected = [];
            document.querySelectorAll('.fault-check:checked').forEach(c => selected.push(c.nextElementSibling.value));
            if(selected.length === 0) return alert("Select at least one item.");
            navigator.clipboard.writeText(selected.join('\n')).then(() => alert("Copied to clipboard!"));
        }

        function filterList() {
            let filter = document.getElementById('searchBar').value.toLowerCase();
            document.querySelectorAll('.defect-row').forEach(row => {
                let text = row.querySelector('.fault-text').value.toLowerCase();
                row.style.display = text.includes(filter) ? "flex" : "none";
            });
        }
    </script>
</body>
</html>
